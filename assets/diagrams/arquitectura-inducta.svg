      <rect x="612" y="324" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="626" y="333" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FN</text>
      <text x="676" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Edge Functions</text>
      <text x="676" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tbk-iniciar · confirmar</text>

      <!-- Transbank -->
      <rect x="792" y="316" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="316" width="144" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="800" y="324" width="28" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="814" y="333" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="864" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transbank</text>
      <text x="864" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Webpay Plus</text>

      <!-- Legend -->
      <line x1="40" y1="444" x2="960" y2="444" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="40" y="476" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / datos</text>
      <rect x="168" y="476" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Funciones</text>
      <rect x="276" y="476" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="296" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Storage</text>
      <rect x="372" y="476" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <text x="392" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">App / auth</text>
      <rect x="484" y="476" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="504" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Externo</text>
      <line x1="584" y1="482" x2="612" y2="482" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="620" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API</text>
      <line x1="712" y1="482" x2="740" y2="482" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="748" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flujo principal</text>
      <line x1="864" y1="482" x2="892" y2="482" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="900" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async</text>
    </svg>
