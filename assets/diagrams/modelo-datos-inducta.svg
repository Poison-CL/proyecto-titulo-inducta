      <text x="324" y="154" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">N</text>
      <text x="268" y="248" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">1</text>
      <text x="324" y="272" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">N</text>
      <text x="188" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">1</text>
