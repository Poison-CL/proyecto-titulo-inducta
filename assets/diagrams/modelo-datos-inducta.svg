<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inducta-er-title inducta-er-desc">
      <title id="inducta-er-title">Inducta Chile · modelo de datos</title>
      <desc id="inducta-er-desc">Modelo entidad-relación multi-tenant: empresa como raíz, tests, avances, certificados y pagos Transbank.</desc>
